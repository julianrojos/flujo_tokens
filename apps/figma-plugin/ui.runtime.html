<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DS Graph Plugin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f5f5f5; }
    #root { min-height: 100vh; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // React CJS bundles may read process.env.NODE_ENV in embedded environments.
    // Figma plugin iframes do not provide process by default.
    if (!window.process) {
      window.process = { env: { NODE_ENV: 'production' } };
    } else if (!window.process.env) {
      window.process.env = { NODE_ENV: 'production' };
    } else if (!window.process.env.NODE_ENV) {
      window.process.env.NODE_ENV = 'production';
    }
  </script>
  <script>
__INLINE_UI_JS__
  </script>
</body>
</html>
