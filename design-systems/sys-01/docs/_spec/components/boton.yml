name: boton
status: draft
summary:
  purpose: Text button component with Default and Accent visual variants.
  when_to_use: Use for short, high-priority actions inside compact interfaces.
  when_not_to_use: Avoid for long-form text actions or when icon-only controls are required.
figma:
  component_set_node_id: '1:23'
anatomy:
  - id: '1:24'
    name: Variant=Accent
    type: COMPONENT
    width: 48
    height: 31
    fill: '#000000'
    children:
      - id: '1:25'
        name: Texto
        type: TEXT
        width: 32
        height: 15
        fill: '#FFFFFF'
        textStyle: Inter/12
  - id: '1:22'
    name: Variant=Default
    type: COMPONENT
    width: 48
    height: 31
    fill: '#FFFFFF'
    children:
      - id: '1:3'
        name: Texto
        type: TEXT
        width: 32
        height: 15
        fill: '#000000'
        textStyle: Inter/12
properties:
  - name: Variant
    type: VARIANT
    default: Default
    variant: false
    required: true
content_guidelines:
  rules:
    - Keep labels concise and action-oriented.
    - Use sentence case for the visible text.
best_practices:
  do:
    - Use semantic foreground/background tokens for each variant.
    - Keep button labels to one or two words.
  dont:
    - Do not overload this component with tertiary icon behavior.
    - Do not introduce custom colors outside token mapping.
accessibility:
  role: button
  focus:
    tokens:
      inner: semanticos.color.foreground.accent
      outer: semanticos.color.background.accent
  hit_area:
    desktop_token: primitivos.tamano.14
    mobile_token: primitivos.tamano.14
  labeling:
    rules:
      - Provide an explicit action label.
token_mapping:
  container.background:
    Variant=Default: semanticos.color.background.default
    Variant=Accent: semanticos.color.background.accent
  text.color:
    Variant=Default: semanticos.color.foreground.default
    Variant=Accent: semanticos.color.foreground.accent
qa:
  - Variant property exposes Default and Accent values.
  - Text contrast remains readable in both variants.
variants: []
layout:
  - node: botón
    direction: NONE
    alignment: AUTO
    hSizing: FIXED
    vSizing: FIXED
  - node: Variant=Accent
    direction: HORIZONTAL
    alignment: CENTER
    hSizing: FIXED
    vSizing: FIXED
    itemSpacing: 8
    padding:
      top: 8
      right: 8
      bottom: 8
      left: 8
  - node: Texto
    direction: NONE
    alignment: AUTO
    hSizing: FIXED
    vSizing: FIXED
  - node: Variant=Default
    direction: HORIZONTAL
    alignment: CENTER
    hSizing: FIXED
    vSizing: FIXED
    itemSpacing: 8
    padding:
      top: 8
      right: 8
      bottom: 8
      left: 8
  - node: Texto
    direction: NONE
    alignment: AUTO
    hSizing: FIXED
    vSizing: FIXED
