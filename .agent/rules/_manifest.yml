version: 1

enforcement:
  blocking_source: checks
  informational_only:
    - rules[].blocking
    - matrix.by_doc_type
    - matrix.by_skill

rules:
  - id: accessibility-docs
    file: accessibility-docs.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: true
  - id: agent-output-contract
    file: agent-output-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
  - id: agent-prompt-contract
    file: agent-prompt-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
  - id: component-doc
    file: component-doc.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: component-figma-traceability
    file: component-figma-traceability.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: true
  - id: component-indices-sync
    file: component-indices-sync.mdc
    owner: docs-governance
    applies_to: [pipeline, markdown]
    blocking: true
  - id: component-name-normalization
    file: component-name-normalization.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
  - id: component-spec-properties-order
    file: component-spec-properties-order.mdc
    owner: docs-governance
    applies_to: [spec]
    blocking: true
  - id: component-spec-yaml
    file: component-spec-yaml.mdc
    owner: docs-governance
    applies_to: [spec]
    blocking: true
  - id: component-versioning
    file: component-versioning.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
  - id: design-token-discrepancies
    file: design-token-discrepancies.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: docs-language-tone
    file: docs-language-tone.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: docs-pipeline-contract
    file: docs-pipeline-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
  - id: evidence-gated-mutations
    file: evidence-gated-mutations.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
  - id: docs-taxonomy
    file: docs-taxonomy.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: ds-docs-guardrails
    file: ds-docs-guardrails.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
  - id: figma-doc-rendering
    file: figma-doc-rendering.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
  - id: figma-doc-rendering-implementation
    file: figma-doc-rendering-implementation.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: false
  - id: frontmatter-contract
    file: frontmatter-contract.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: markdown-figma-subset
    file: markdown-figma-subset.mdc
    owner: docs-governance
    applies_to: [markdown, pipeline]
    blocking: true
  - id: markdown-lifecycle-status
    file: markdown-lifecycle-status.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: overview-components-canonical-list
    file: overview-components-canonical-list.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: overview-index-maintenance
    file: overview-index-maintenance.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: prohibited-patterns
    file: prohibited-patterns.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
  - id: readme-maintenance
    file: readme-maintenance.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
  - id: skill-input-output-contract
    file: skill-input-output-contract.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: true
  - id: skill-versioning
    file: skill-versioning.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: true
  - id: token-references
    file: token-references.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
  - id: token-registry-validation
    file: token-registry-validation.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true

checks:
  REG01:
    rule_ids: [ds-docs-guardrails, docs-pipeline-contract]
    blocking: true
  DOC01:
    rule_ids: [ds-docs-guardrails, docs-pipeline-contract]
    blocking: true
  FM01:
    rule_ids: [frontmatter-contract, component-figma-traceability, docs-taxonomy]
    blocking: true
  FM02:
    rule_ids: [frontmatter-contract, markdown-lifecycle-status]
    blocking: true
  SEC01:
    rule_ids: [component-doc]
    blocking: true
  SEC02:
    rule_ids: [component-doc]
    blocking: true
  TOK01:
    rule_ids: [token-references, token-registry-validation]
    blocking: true
  TOK02:
    rule_ids: [token-references, token-registry-validation]
    blocking: true
  TOK03:
    rule_ids: [prohibited-patterns, ds-docs-guardrails, token-references, token-registry-validation]
    blocking: true
  SPEC01:
    rule_ids: [component-spec-yaml, token-registry-validation]
    blocking: true
  REL01:
    rule_ids: [component-spec-yaml]
    blocking: false
  DET01:
    rule_ids: [component-spec-properties-order]
    blocking: true
  NAME01:
    rule_ids: [component-name-normalization]
    blocking: true
  NAME02:
    rule_ids: [component-name-normalization, component-spec-yaml]
    blocking: true
  TRACE01:
    rule_ids: [component-figma-traceability, component-spec-yaml]
    blocking: true
  TRACE02:
    rule_ids: [docs-pipeline-contract, ds-docs-guardrails]
    blocking: true
  TRACE03:
    rule_ids: [component-figma-traceability, docs-pipeline-contract]
    blocking: true
  LINK01:
    rule_ids: [overview-index-maintenance]
    blocking: true
  LINK02:
    rule_ids: [overview-components-canonical-list]
    blocking: true
  LINK03:
    rule_ids: [ds-docs-guardrails]
    blocking: true
  GAP00:
    rule_ids: [component-doc]
    blocking: false
  GAP01:
    rule_ids: [component-doc, ds-docs-guardrails]
    blocking: true
  GAP02:
    rule_ids: [component-spec-yaml, markdown-lifecycle-status]
    blocking: true
  PAIR01:
    rule_ids: [docs-pipeline-contract, ds-docs-guardrails]
    blocking: true
  READY01:
    rule_ids: [markdown-lifecycle-status, component-spec-yaml, ds-docs-guardrails]
    blocking: true
  QLT01:
    rule_ids: [ds-docs-guardrails]
    blocking: true
  VIS01:
    rule_ids: [component-doc, markdown-lifecycle-status, ds-docs-guardrails]
    blocking: true
  SLOT01:
    rule_ids: [skill-input-output-contract, skill-versioning]
    blocking: true
  VER01:
    rule_ids: [component-versioning]
    blocking: true
  GOV01:
    rule_ids: [docs-pipeline-contract]
    blocking: true
  EVID01:
    rule_ids: [evidence-gated-mutations, ds-docs-guardrails]
    blocking: true
  EVID02:
    rule_ids: [evidence-gated-mutations, docs-pipeline-contract]
    blocking: true

matrix:
  by_doc_type:
    component:
      [
        frontmatter-contract,
        component-doc,
        component-figma-traceability,
        accessibility-docs,
        design-token-discrepancies,
        token-references,
        token-registry-validation,
        markdown-lifecycle-status,
        docs-language-tone,
        evidence-gated-mutations,
        prohibited-patterns,
      ]
    overview:
      [
        frontmatter-contract,
        docs-taxonomy,
        overview-index-maintenance,
        overview-components-canonical-list,
        markdown-lifecycle-status,
        docs-language-tone,
      ]
    foundation:
      [
        frontmatter-contract,
        docs-taxonomy,
        token-references,
        token-registry-validation,
        design-token-discrepancies,
        markdown-lifecycle-status,
        docs-language-tone,
      ]
    workflow:
      [frontmatter-contract, docs-taxonomy, markdown-lifecycle-status, docs-language-tone]
    spec:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-references,
        token-registry-validation,
        accessibility-docs,
        evidence-gated-mutations,
        prohibited-patterns,
      ]
    skills: [skill-versioning, skill-input-output-contract]
  by_skill:
    design-tokens-advisor: [skill-versioning]
    ds-component-doc:
      [
        ds-docs-guardrails,
        frontmatter-contract,
        component-doc,
        component-spec-yaml,
        component-spec-properties-order,
        component-figma-traceability,
        component-name-normalization,
        markdown-lifecycle-status,
        accessibility-docs,
        design-token-discrepancies,
        token-references,
        token-registry-validation,
        docs-language-tone,
        overview-index-maintenance,
        overview-components-canonical-list,
        docs-pipeline-contract,
        evidence-gated-mutations,
        skill-input-output-contract,
      ]
    ds-component-orchestrator:
      [
        docs-pipeline-contract,
        component-spec-yaml,
        component-doc,
        frontmatter-contract,
        component-figma-traceability,
        component-name-normalization,
        markdown-lifecycle-status,
        ds-docs-guardrails,
        evidence-gated-mutations,
        skill-input-output-contract,
      ]
    ds-spec-from-figma:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-references,
        token-registry-validation,
        ds-docs-guardrails,
        docs-pipeline-contract,
        evidence-gated-mutations,
        skill-input-output-contract,
      ]
    ds-markdown-to-figma-section:
      [
        component-doc,
        ds-docs-guardrails,
        docs-pipeline-contract,
        figma-doc-rendering,
        markdown-figma-subset,
      ]
    ds-foundations:
      [
        ds-docs-guardrails,
        docs-taxonomy,
        token-references,
        token-registry-validation,
        accessibility-docs,
        docs-language-tone,
        overview-index-maintenance,
      ]
    ds-init-docs:
      [ds-docs-guardrails, docs-taxonomy, frontmatter-contract, docs-language-tone]
    ds-migrate-legacy-component:
      [
        component-spec-yaml,
        component-doc,
        component-figma-traceability,
        component-name-normalization,
        token-references,
        token-registry-validation,
        markdown-lifecycle-status,
        docs-pipeline-contract,
      ]
    ds-audit-consistency:
      [
        component-figma-traceability,
        token-registry-validation,
        markdown-lifecycle-status,
        docs-pipeline-contract,
      ]
    ds-tokens-sync: [token-registry-validation, ds-docs-guardrails]
