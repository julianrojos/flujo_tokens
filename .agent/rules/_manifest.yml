version: 1

rules:
  - id: frontmatter-contract
    file: frontmatter-contract.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: prohibited-patterns
    file: prohibited-patterns.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
  - id: ds-docs-guardrails
    file: ds-docs-guardrails.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
  - id: component-doc-structure
    file: component-doc-structure.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: component-doc-content
    file: component-doc-content.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: component-figma-traceability
    file: component-figma-traceability.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: true
  - id: component-spec-yaml
    file: component-spec-yaml.mdc
    owner: docs-governance
    applies_to: [spec]
    blocking: true
  - id: component-spec-properties-order
    file: component-spec-properties-order.mdc
    owner: docs-governance
    applies_to: [spec]
    blocking: true
  - id: component-versioning
    file: component-versioning.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
  - id: component-name-normalization
    file: component-name-normalization.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
  - id: token-references
    file: token-references.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
  - id: token-registry-validation
    file: token-registry-validation.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
  - id: markdown-lifecycle-status
    file: markdown-lifecycle-status.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: overview-index-maintenance
    file: overview-index-maintenance.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: overview-components-canonical-list
    file: overview-components-canonical-list.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: docs-taxonomy
    file: docs-taxonomy.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
  - id: docs-pipeline-contract
    file: docs-pipeline-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
  - id: skill-versioning
    file: skill-versioning.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: false
  - id: agent-output-contract
    file: agent-output-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true

checks:
  REG01:
    rule_ids: [ds-docs-guardrails, docs-pipeline-contract]
    blocking: true
  DOC01:
    rule_ids: [ds-docs-guardrails, docs-pipeline-contract]
    blocking: true
  FM01:
    rule_ids:
      [frontmatter-contract, component-figma-traceability, docs-taxonomy]
    blocking: true
  FM02:
    rule_ids: [frontmatter-contract, markdown-lifecycle-status]
    blocking: true
  SEC01:
    rule_ids: [component-doc-structure]
    blocking: true
  SEC02:
    rule_ids: [component-doc-structure]
    blocking: true
  TOK01:
    rule_ids: [token-references, token-registry-validation]
    blocking: true
  TOK02:
    rule_ids: [token-references, token-registry-validation]
    blocking: true
  TOK03:
    rule_ids:
      [
        prohibited-patterns,
        ds-docs-guardrails,
        token-references,
        token-registry-validation,
      ]
    blocking: true
  SPEC01:
    rule_ids: [component-spec-yaml, token-registry-validation]
    blocking: true
  DET01:
    rule_ids: [component-spec-properties-order]
    blocking: true
  NAME01:
    rule_ids: [component-name-normalization]
    blocking: true
  NAME02:
    rule_ids: [component-name-normalization, component-spec-yaml]
    blocking: true
  TRACE01:
    rule_ids: [component-figma-traceability, component-spec-yaml]
    blocking: true
  TRACE02:
    rule_ids: [docs-pipeline-contract, ds-docs-guardrails]
    blocking: true
  LINK01:
    rule_ids: [overview-index-maintenance]
    blocking: true
  LINK02:
    rule_ids: [overview-components-canonical-list]
    blocking: true
  GAP00:
    rule_ids: [component-doc-structure]
    blocking: false
  GAP01:
    rule_ids: [component-doc-structure, ds-docs-guardrails]
    blocking: true
  GAP02:
    rule_ids: [component-spec-yaml, markdown-lifecycle-status]
    blocking: true
  PAIR01:
    rule_ids: [docs-pipeline-contract, ds-docs-guardrails]
    blocking: true
  READY01:
    rule_ids:
      [markdown-lifecycle-status, component-spec-yaml, ds-docs-guardrails]
    blocking: true
  VER01:
    rule_ids: [component-versioning]
    blocking: true

matrix:
  by_doc_type:
    component:
      [
        frontmatter-contract,
        component-doc-structure,
        component-doc-content,
        component-figma-traceability,
        token-references,
        token-registry-validation,
        markdown-lifecycle-status,
        prohibited-patterns,
      ]
    overview:
      [
        frontmatter-contract,
        docs-taxonomy,
        overview-index-maintenance,
        overview-components-canonical-list,
        markdown-lifecycle-status,
      ]
    foundation:
      [
        frontmatter-contract,
        docs-taxonomy,
        token-references,
        token-registry-validation,
        markdown-lifecycle-status,
      ]
    workflow: [frontmatter-contract, docs-taxonomy, markdown-lifecycle-status]
    spec:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-references,
        token-registry-validation,
        prohibited-patterns,
      ]
    skills: [skill-versioning]
  by_skill:
    ds-component-doc:
      [
        frontmatter-contract,
        component-doc-structure,
        component-doc-content,
        component-figma-traceability,
        component-name-normalization,
        token-references,
        token-registry-validation,
        docs-pipeline-contract,
      ]
    ds-spec-from-figma:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-references,
        token-registry-validation,
        docs-pipeline-contract,
      ]
    ds-markdown-to-figma-section: [docs-pipeline-contract]
    ds-doc-from-figma-url:
      [
        frontmatter-contract,
        component-doc-structure,
        component-doc-content,
        component-figma-traceability,
        docs-pipeline-contract,
      ]
