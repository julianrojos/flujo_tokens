version: 1

enforcement:
  blocking_source: validation.checks
  informational_only:
    - rules[].blocking
    - rules[].layer
    - matrix.by_doc_type
    - matrix.by_stage

rules:
  - id: inclusive-docs
    file: inclusive-docs.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: true
    layer: domain
  - id: agent-output-contract
    file: agent-output-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: domain
  - id: agent-prompt-contract
    file: agent-prompt-contract.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: domain
  - id: component-doc
    file: component-doc.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: stage
  - id: component-figma-metadata
    file: component-figma-metadata.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: true
    layer: stage
  - id: component-visual-usage
    file: component-visual-usage.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: false
    layer: domain
  - id: component-name-normalization
    file: component-name-normalization.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
    layer: stage
  - id: component-spec-properties-order
    file: component-spec-properties-order.mdc
    owner: docs-governance
    applies_to: [spec]
    blocking: true
    layer: stage
  - id: component-spec-yaml
    file: component-spec-yaml.mdc
    owner: docs-governance
    applies_to: [spec]
    blocking: true
    layer: stage
  - id: component-versioning
    file: component-versioning.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
    layer: domain
  - id: design-token-discrepancies
    file: design-token-discrepancies.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: domain
  - id: docs-language-tone
    file: docs-language-tone.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: stage
  - id: error-codes
    file: error-codes.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: domain
  - id: docs-governance-ops
    file: docs-governance-ops.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: domain
  - id: docs-taxonomy
    file: docs-taxonomy.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: domain
  - id: general-programming-principles
    file: general-programming-principles.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: false
    layer: core
  - id: git-constraints
    file: git-constraints.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: core
  - id: overview-components-canonical-list
    file: overview-components-canonical-list.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: domain
  - id: overview-index-maintenance
    file: overview-index-maintenance.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: domain
  - id: pattern-doc-workflow
    file: pattern-doc-workflow.mdc
    owner: docs-governance
    applies_to: [markdown]
    blocking: true
    layer: domain
  - id: prohibited-patterns
    file: prohibited-patterns.mdc
    owner: docs-governance
    applies_to: [spec, markdown, pipeline]
    blocking: true
    layer: core
  - id: readme-maintenance
    file: readme-maintenance.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: domain
  - id: review-judge-workflow-format
    file: review-judge-workflow-format.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: core
  - id: skill-input-output-contract
    file: skill-input-output-contract.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: true
    layer: domain
  - id: skill-versioning
    file: skill-versioning.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: true
    layer: domain
  - id: ui-architecture-boundaries
    file: ui-architecture-boundaries.mdc
    owner: ui-governance
    applies_to: [frontend]
    blocking: true
    layer: core
  - id: ui-style-contract
    file: ui-style-contract.mdc
    owner: ui-governance
    applies_to: [frontend]
    blocking: true
    layer: core
  - id: ui-component-governance
    file: ui-component-governance.mdc
    owner: ui-governance
    applies_to: [frontend]
    blocking: true
    layer: domain
  - id: token-references
    file: token-references.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
    layer: domain
  - id: token-registry-validation
    file: token-registry-validation.mdc
    owner: docs-governance
    applies_to: [spec, markdown]
    blocking: true
    layer: stage

validation:
  source_catalog: error-codes
  checks:
    SEC01:
      rule_ids: [component-doc]
      blocking: true
    SEC02:
      rule_ids: [component-doc]
      blocking: true
    TOK01:
      rule_ids: [token-references, token-registry-validation]
      blocking: true
    TOK02:
      rule_ids: [token-references, token-registry-validation]
      blocking: true
    TOK03:
      rule_ids:
        [
          prohibited-patterns,
          token-references,
          token-registry-validation,
        ]
      blocking: true
    REL01:
      rule_ids: [component-spec-yaml]
      blocking: false
    DET01:
      rule_ids: [component-spec-properties-order]
      blocking: true
    NAME01:
      rule_ids: [component-name-normalization]
      blocking: true
    NAME02:
      rule_ids: [component-name-normalization, component-spec-yaml]
      blocking: true
    TRACE01:
      rule_ids: [component-figma-metadata, component-spec-yaml]
      blocking: true
    LINK01:
      rule_ids: [overview-index-maintenance]
      blocking: true
    LINK02:
      rule_ids: [overview-components-canonical-list]
      blocking: true
    LINK03:
      rule_ids: [component-doc]
      blocking: true
    GAP00:
      rule_ids: [component-doc]
      blocking: false
    GAP01:
      rule_ids: [component-doc]
      blocking: true
    GAP02:
      rule_ids: [component-spec-yaml]
      blocking: true
    PAIR01:
      rule_ids: [component-doc, component-spec-yaml]
      blocking: true
    READY01:
      rule_ids: [component-spec-yaml]
      blocking: true
    QLT01:
      rule_ids: [component-doc]
      blocking: true
    DEP01:
      rule_ids: [docs-governance-ops]
      blocking: true
      description: 'Detects references to deprecated rule IDs in skill metadata.'
    SLOT01:
      rule_ids: [skill-input-output-contract, skill-versioning]
      blocking: true
    VER01:
      rule_ids: [component-versioning]
      blocking: true
    GOV01:
      rule_ids: [docs-governance-ops]
      blocking: true
    UI01:
      rule_ids: [ui-architecture-boundaries]
      blocking: true
    UI02:
      rule_ids: [ui-style-contract]
      blocking: true
    UI03:
      rule_ids: [ui-component-governance]
      blocking: true
    GIT01:
      rule_ids: [git-constraints]
      blocking: true

matrix:
  by_doc_type:
    component:
      [
        component-doc,
        component-visual-usage,
        component-figma-metadata,
        inclusive-docs,
        design-token-discrepancies,
        token-references,
        token-registry-validation,
        docs-language-tone,
        prohibited-patterns,
        general-programming-principles,
        git-constraints,
      ]
    overview:
      [
        docs-taxonomy,
        overview-index-maintenance,
        overview-components-canonical-list,
        docs-language-tone,
        git-constraints,
      ]
    workflow:
      [
        docs-taxonomy,
        docs-governance-ops,
        pattern-doc-workflow,
        inclusive-docs,
        docs-language-tone,
        git-constraints,
      ]
    spec:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-references,
        token-registry-validation,
        inclusive-docs,
        prohibited-patterns,
        git-constraints,
      ]
    frontend:
      [
        ui-architecture-boundaries,
        ui-style-contract,
        ui-component-governance,
        general-programming-principles,
        git-constraints,
      ]
    skills: [skill-versioning, skill-input-output-contract, git-constraints]
  by_stage:
    spec:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-registry-validation,
        general-programming-principles,
        git-constraints,
      ]
    markdown:
      [
        component-doc,
        docs-language-tone,
        general-programming-principles,
        git-constraints,
      ]
    visual-proof: [component-figma-metadata]
    pipeline:
      [
        review-judge-workflow-format,
        git-constraints,
      ]
    frontend:
      [
        ui-architecture-boundaries,
        ui-style-contract,
        ui-component-governance,
        general-programming-principles,
        git-constraints,
      ]
    skills: [skill-versioning, skill-input-output-contract, git-constraints]
