version: 1

enforcement:
  blocking_source: validation.checks
  informational_only:
    - rules[].blocking
    - rules[].layer
    - matrix.by_doc_type
    - matrix.by_stage

rules:
  - id: general-programming-principles
    file: general-programming-principles.mdc
    owner: docs-governance
    applies_to: [markdown, spec]
    blocking: false
    layer: core
  - id: git-constraints
    file: git-constraints.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: core
  - id: readme-maintenance
    file: readme-maintenance.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: domain
  - id: review-judge-workflow-format
    file: review-judge-workflow-format.mdc
    owner: docs-governance
    applies_to: [pipeline]
    blocking: true
    layer: core
  - id: skill-input-output-contract
    file: skill-input-output-contract.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: true
    layer: domain
  - id: skill-versioning
    file: skill-versioning.mdc
    owner: docs-governance
    applies_to: [skills]
    blocking: true
    layer: domain
  - id: ui-architecture-boundaries
    file: ui-architecture-boundaries.mdc
    owner: ui-governance
    applies_to: [frontend]
    blocking: true
    layer: core
  - id: ui-style-contract
    file: ui-style-contract.mdc
    owner: ui-governance
    applies_to: [frontend]
    blocking: true
    layer: core
  - id: ui-component-governance
    file: ui-component-governance.mdc
    owner: ui-governance
    applies_to: [frontend]
    blocking: true
    layer: domain
validation:
  checks:
    SLOT01:
      rule_ids: [skill-input-output-contract, skill-versioning]
      blocking: true
    UI01:
      rule_ids: [ui-architecture-boundaries]
      blocking: true
    UI02:
      rule_ids: [ui-style-contract]
      blocking: true
    UI03:
      rule_ids: [ui-component-governance]
      blocking: true
    GIT01:
      rule_ids: [git-constraints]
      blocking: true

matrix:
  by_doc_type:
    component:
      [
        general-programming-principles,
        git-constraints,
      ]
    overview: [git-constraints]
    workflow:
      [git-constraints]
    spec:
      [
        git-constraints,
      ]
    frontend:
      [
        ui-architecture-boundaries,
        ui-style-contract,
        ui-component-governance,
        general-programming-principles,
        git-constraints,
      ]
    skills: [skill-versioning, skill-input-output-contract, git-constraints]
  by_stage:
    spec:
      [
        general-programming-principles,
        git-constraints,
      ]
    markdown:
      [
        general-programming-principles,
        git-constraints,
      ]
    pipeline: [review-judge-workflow-format, git-constraints]
    frontend:
      [
        ui-architecture-boundaries,
        ui-style-contract,
        ui-component-governance,
        general-programming-principles,
        git-constraints,
      ]
    skills: [skill-versioning, skill-input-output-contract, git-constraints]
