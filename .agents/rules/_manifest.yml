checks:
  source_catalog: error-codes
  REG01:
    rule_ids: [ds-docs-guardrails, docs-pipeline-contract]
    blocking: true
  DOC01:
    rule_ids: [ds-docs-guardrails, docs-pipeline-contract]
    blocking: true
  FM01:
    rule_ids:
      [frontmatter-contract, component-figma-traceability, docs-taxonomy]
    blocking: true
  FM02:
    rule_ids: [frontmatter-contract, markdown-lifecycle-status]
    blocking: true
  SEC01:
    rule_ids: [component-doc]
    blocking: true
  SEC02:
    rule_ids: [component-doc]
    blocking: true
  TOK01:
    rule_ids: [token-references, token-registry-validation]
    blocking: true
  TOK02:
    rule_ids: [token-references, token-registry-validation]
    blocking: true
  TOK03:
    rule_ids:
      [
        prohibited-patterns,
        ds-docs-guardrails,
        token-references,
        token-registry-validation,
      ]
    blocking: true
  SPEC01:
    rule_ids: [component-spec-yaml, token-registry-validation]
    blocking: true
  REL01:
    rule_ids: [component-spec-yaml]
    blocking: false
  DET01:
    rule_ids: [component-spec-properties-order]
    blocking: true
  NAME01:
    rule_ids: [component-name-normalization]
    blocking: true
  NAME02:
    rule_ids: [component-name-normalization, component-spec-yaml]
    blocking: true
  TRACE01:
    rule_ids: [component-figma-traceability, component-spec-yaml]
    blocking: true
  TRACE02:
    rule_ids: [docs-pipeline-contract, ds-docs-guardrails]
    blocking: true
  TRACE03:
    rule_ids: [component-figma-traceability, docs-pipeline-contract]
    blocking: true
  LINK01:
    rule_ids: [overview-index-maintenance]
    blocking: true
  LINK02:
    rule_ids: [overview-components-canonical-list]
    blocking: true
  LINK03:
    rule_ids: [ds-docs-guardrails]
    blocking: true
  GAP00:
    rule_ids: [component-doc]
    blocking: false
  GAP01:
    rule_ids: [component-doc, ds-docs-guardrails]
    blocking: true
  GAP02:
    rule_ids: [component-spec-yaml, markdown-lifecycle-status]
    blocking: true
  PAIR01:
    rule_ids: [docs-pipeline-contract, ds-docs-guardrails]
    blocking: true
  READY01:
    rule_ids:
      [markdown-lifecycle-status, component-spec-yaml, ds-docs-guardrails]
    blocking: true
  QLT01:
    rule_ids: [ds-docs-guardrails]
    blocking: true
  VIS01:
    rule_ids: [component-doc, markdown-lifecycle-status, ds-docs-guardrails]
    blocking: true
  DEP01:
    rule_ids: [docs-governance-ops]
    blocking: true
    description: "Detects references to deprecated rule IDs in skill metadata."
  SLOT01:
    rule_ids: [skill-input-output-contract, skill-versioning]
    blocking: true
  VER01:
    rule_ids: [component-versioning]
    blocking: true
  GOV01:
    rule_ids: [docs-pipeline-contract]
    blocking: true
  EVID01:
    rule_ids: [evidence-gated-mutations, ds-docs-guardrails]
    blocking: true
  EVID02:
    rule_ids: [evidence-gated-mutations, docs-pipeline-contract]
    blocking: true
  UI01:
    rule_ids: [ui-architecture-boundaries]
    blocking: true
  UI02:
    rule_ids: [ui-style-contract]
    blocking: true
  UI03:
    rule_ids: [ui-component-governance]
    blocking: true
  GIT01:
    rule_ids: [git-constraints]
    blocking: true

matrix:
  by_doc_type:
    component:
      [
        frontmatter-contract,
        component-doc,
        component-visual-usage,
        component-figma-traceability,
        inclusive-docs,
        design-token-discrepancies,
        token-references,
        token-registry-validation,
        markdown-lifecycle-status,
        docs-language-tone,
        ds-docs-guardrails,
        evidence-gated-mutations,
        prohibited-patterns,
        general-programming-principles,
        git-constraints,
      ]
    overview:
      [
        frontmatter-contract,
        docs-taxonomy,
        overview-index-maintenance,
        overview-components-canonical-list,
        markdown-lifecycle-status,
        docs-language-tone,
        ds-docs-guardrails,
        git-constraints,
      ]
    foundation:
      [
        frontmatter-contract,
        docs-taxonomy,
        inclusive-docs,
        token-references,
        token-registry-validation,
        design-token-discrepancies,
        markdown-lifecycle-status,
        docs-language-tone,
        ds-docs-guardrails,
        git-constraints,
      ]
    workflow:
      [
        frontmatter-contract,
        docs-taxonomy,
        docs-governance-ops,
        pattern-doc-workflow,
        inclusive-docs,
        markdown-lifecycle-status,
        docs-language-tone,
        ds-docs-guardrails,
        git-constraints,
      ]
    spec:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-references,
        token-registry-validation,
        inclusive-docs,
        ds-docs-guardrails,
        evidence-gated-mutations,
        prohibited-patterns,
        git-constraints,
      ]
    frontend:
      [
        ui-architecture-boundaries,
        ui-style-contract,
        ui-component-governance,
        general-programming-principles,
        git-constraints,
      ]
    skills: [skill-versioning, skill-input-output-contract, git-constraints]
  by_stage:
    spec:
      [
        component-spec-yaml,
        component-spec-properties-order,
        component-name-normalization,
        token-registry-validation,
        general-programming-principles,
        git-constraints,
      ]
    markdown:
      [
        component-doc,
        frontmatter-contract,
        markdown-lifecycle-status,
        docs-language-tone,
        general-programming-principles,
        git-constraints,
      ]
    figma: [figma-rendering]
    visual-proof: [component-figma-traceability]
    pipeline:
      [
        docs-pipeline-contract,
        component-indices-sync,
        review-judge-workflow-format,
        git-constraints,
      ]
    frontend:
      [
        ui-architecture-boundaries,
        ui-style-contract,
        ui-component-governance,
        general-programming-principles,
        git-constraints,
      ]
    skills: [skill-versioning, skill-input-output-contract, git-constraints]
