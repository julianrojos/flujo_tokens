name: figma-doc-theme-karmap
status: ready
description: >
  Render contract for converting markdown component docs into Figma documentation
  sections. Styled to match the Karmap / Iter design system visual identity:
  Lora headings, Nunito Sans body, cucumber-green accents on warm cream surfaces.

layout:
  target:
    section_name_pattern: "Doc/{component_name}"
    position:
      reference: component_section
      offset_x: 200
      align_y: top
  section:
    width: 940
    min_height: 1100
  canvas:
    inset: 40
    width: 860
    padding:
      top: 32
      right: 32
      bottom: 32
      left: 32
    item_spacing: 20

theme:
  colors:
    # Surfaces — from DS Semantic tokens
    page_bg: "#FFFAF0"
    section_border: "#C9E0BE"
    canvas_shadow: "#00000014"
    # Cards
    card_bg: "#FFFFFF"
    card_border: "#E7DDCF"
    # Table header row
    table_header_bg: "#F5F0E6"
    # Text — from DS Color/Text tokens
    title_text: "#495841"
    heading_text: "#495841"
    body_text: "#483F3F"
    muted_text: "#716666"
    # Chips — cucumber-tinted
    chip_bg: "#E8F0E4"
    chip_border: "#C9E0BE"
    chip_text: "#495841"
    # Header accent — brand secondary
    header_accent: "#C9E0BE"
  radii:
    canvas: 20
    card: 12
    chip: 999
    header_accent: 12
  strokes:
    section_border: 1.5
    card_border: 1
    chip_border: 1
  spacing:
    card_padding: 20
    card_gap: 12
    chip_padding_v: 5
    chip_padding_h: 12
    chip_gap: 8
    paragraph_gap: 8
    list_gap: 6
    header_accent_padding_v: 16
    header_accent_padding_h: 24
  typography:
    font_family: "Nunito Sans"
    font_family_heading: "Lora"
    h1:
      font_family: "Lora"
      size: 36
      line_height: 42
      weight: Bold
      color: title_text
    h2:
      font_family: "Lora"
      size: 20
      line_height: 26
      weight: Bold
      color: heading_text
    h3:
      size: 16
      line_height: 24
      weight: SemiBold
      color: heading_text
    body:
      size: 15
      line_height: 24
      weight: Regular
      color: body_text
    body_small:
      size: 13
      line_height: 18
      weight: SemiBold
      color: chip_text

markdown_mapping:
  document:
    wrapper: canvas
  title:
    component: header_block
    text_style: h1
  subtitle:
    component: intro_text
    text_style: body
    color_override: muted_text
  heading_2:
    component: card
    title_style: h2
  heading_3:
    component: inline_heading
    text_style: h3
  paragraph:
    component: text
    text_style: body
  unordered_list:
    component: stack
    item_gap: list_gap
  ordered_list:
    component: stack
    item_gap: list_gap
  list_item:
    component: text
    text_style: body
  table:
    component: table_card
    header_style: h3
    cell_style: body
    border_color: card_border
    header_bg: table_header_bg
  code_inline:
    component: text
    text_style: body
    color_override: heading_text

components:
  header_block:
    layout: vertical
    stretch: true
    item_spacing: 8
    accent:
      enabled: true
      fills:
        color: header_accent
      radius: 12
      padding:
        top: 16
        right: 24
        bottom: 16
        left: 24
  chips_row:
    layout: horizontal
    stretch: true
    item_spacing: 8
  card:
    layout: vertical
    stretch: true
    width: 796
    padding:
      top: 20
      right: 20
      bottom: 20
      left: 20
    item_spacing: 12
    fills:
      color: card_bg
    strokes:
      color: card_border
      weight: 1
    radius: 12
  table_card:
    extends: card
    table:
      cell_padding_v: 8
      cell_padding_h: 10
      row_gap: 0
      column_gap: 0
      border_weight: 1
      header_bg: table_header_bg

rules:
  - Keep one visual card per H2 section.
  - Render markdown in source order; do not reorder content blocks.
  - Preserve semantic spacing and hierarchy from heading levels.
  - Avoid hardcoded widths for text nodes; use stretch behavior when possible.
  - If a markdown element is unsupported, render it as body text and flag it in report.
  - Use Lora for h1 and h2 headings; Nunito Sans for everything else.
  - Table header rows use a tinted background to distinguish from body rows.
  - The header accent block wraps the title area with a brand-colored background.

output_contract:
  report_fields:
    - markdown_path
    - target_section_id
    - theme_name
    - offset_x_applied
    - unsupported_blocks
