name: CheckboxLabelList
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Checkbox
  component_set: Checkbox-Label-List

summary:
  purpose: Groups multiple labeled checkbox rows in a vertical stack.
  when_to_use: Use for lists of independent options in filter and preference panels.
  when_not_to_use: Do not use for single-option selection or mutually exclusive choices.

anatomy:
  - id: list_container
    description: Vertical Auto Layout wrapper for checkbox-label rows.
  - id: checkbox_label_item
    description: Repeated Checkbox-Label instance row.

