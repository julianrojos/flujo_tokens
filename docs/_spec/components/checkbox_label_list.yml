content_guidelines:
  rules:
    - Keep option labels concise and semantically parallel.
    - Preserve consistent wording across list rows.

best_practices:
  do:
    - Use this component for grouped independent selections.
    - Keep row spacing and ordering stable.
  dont:
    - Do not use this component for radio-like mutually exclusive selection.
    - Do not hide required options without alternative access.

