name: Image
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Image
  component_set: Image
  component_set_node_id: 668:57

summary:
  purpose: Displays decorative or informative image content using fixed-size variants.
  when_to_use: Use when the design requires an image slot at the provided fixed dimensions.
  when_not_to_use: Do not use for interactive controls or dynamic free-size media containers.

anatomy:
  - id: container
    description: Root image container component variant.
  - id: image_layer
    description: Rectangle layer with image fill (`Img_bg`).

properties:
  - name: Size
    type: enum
    values: [90x90, 196x214]
    default: 90x90
    required: true
    description: Size variant axis for image dimensions.

content_guidelines:
  rules:
    - Use source assets with matching aspect ratio for each size variant.
    - Avoid embedding text in images when equivalent semantic text is required.

best_practices:
  do:
    - Keep image crops intentional for both variants.
    - Use consistent image treatment within the same flow.
  dont:
    - Stretch low-resolution assets to fit larger variants.
    - Use this component as a clickable control without explicit interaction design.

accessibility:
  role: img
  focus:
    tokens:
      inner: "Semantic.Color.Focus-Outline.Inner"
      outer: "Semantic.Color.Focus-Outline.Outer"
  hit_area:
    desktop_token: "A11y.A11y.modeDesktop.Dimension.Min-Hit-Area"
    mobile_token: "A11y.A11y.modeMobile.Dimension.Min-Hit-Area"
  labeling:
    rules:
      - Provide meaningful alternative text when image content is informative.
      - Use decorative treatment when image does not add semantic value.

token_mapping:
  image_layer.fill:
    "size=90x90": TBD
    "size=196x214": TBD

qa:
  - "Properties match the Figma component set."
  - "Variant dimensions are documented from Figma metadata."
  - "Token mapping for image fill is TBD pending token governance decision."
