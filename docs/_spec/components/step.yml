name: Step
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Stepper
  component_set: Step
  component_set_node_id: 2282:1793

summary:
  purpose: Represents one progress item inside a stepper flow.
  when_to_use: Use to indicate sequence position in multi-step processes.
  when_not_to_use: Do not use as a standalone navigation control without process context.

anatomy:
  - id: marker
    description: Circular number marker for the step index.
  - id: label
    description: Short text label for step title.
  - id: connector
    description: Visual relation to adjacent steps in composed steppers.

properties:
  - name: State
    type: enum
    values: [Default, Active]
    default: Default
    required: true
    description: Visual emphasis for inactive vs active step.
  - name: Change_Number
    type: text
    default: "1"
    required: false
    description: Step number text content.
  - name: Change_Text
    type: text
    default: STEP TEXT
    required: false
    description: Step label text content.

content_guidelines:
  rules:
    - Keep step labels concise and task-oriented.
    - Keep number and label semantically aligned with process order.

best_practices:
  do:
    - Use consistent wording style across all steps.
    - Use Active state for the current step only.
  dont:
    - Do not use long labels that break scanability.
    - Do not mark multiple steps as active simultaneously.

accessibility:
  role: listitem
  focus:
    tokens:
      inner: Semantic.Color.Focus-Outline.Inner
      outer: Semantic.Color.Focus-Outline.Outer
  hit_area:
    desktop_token: A11y.A11y.Dimension.Min-Hit-Area
    mobile_token: Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA
  labeling:
    rules:
      - Step labels must provide clear process context.
      - Current-step semantics for assistive technologies are TBD.

token_mapping:
  marker.background:
    "state=Default": TBD
    "state=Active": TBD
  label.color:
    "state=Default": TBD
    "state=Active": TBD

qa:
  - Properties match the Figma component set.
  - Variant names match the Figma source values.
