name: Button
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Button
  component_set: Button
  component_set_node_id: 68:4097

summary:
  purpose: Trigger user actions with optional leading and trailing icons.
  when_to_use: Use for explicit user-triggered actions where text and icon affordance improve clarity.
  when_not_to_use: Do not use as persistent navigation chrome.

anatomy:
  - id: container
    description: Root auto-layout frame that defines the button surface.
  - id: leading_icon
    description: Optional icon before the label.
  - id: label
    description: Main action text.
  - id: trailing_icon
    description: Optional icon after the label.

properties:
  - name: State
    type: enum
    values: [Default, Hover, Active, Disabled]
    default: Default
    required: true
    description: Interaction state axis.
  - name: Type
    type: enum
    values: [Primary, Secondary, Cancel]
    default: Primary
    required: true
    description: Semantic style axis.
  - name: "↳ Change txt"
    type: text
    default: Button
    required: false
    description: Overrides the visible label text.
  - name: View txt
    type: boolean
    default: true
    required: false
    description: Toggles label visibility.
  - name: View icn left
    type: boolean
    default: true
    required: false
    description: Toggles leading icon visibility.
  - name: View icn right
    type: boolean
    default: true
    required: false
    description: Toggles trailing icon visibility.
  - name: "↳ Change icn left"
    type: instance_swap
    default: arrow-left-square-contained
    required: false
    description: Swaps the leading icon instance.
  - name: "↳ Change icn right"
    type: instance_swap
    default: arrow-right-square-contained
    required: false
    description: Swaps the trailing icon instance.

content_guidelines:
  rules:
    - Use concise imperative labels in sentence case.
    - Prefer short labels that fit in one line.

best_practices:
  do:
    - Keep State and Type aligned with semantic intent.
    - Keep icon and text visibility consistent with accessibility naming.
  dont:
    - Do not use disabled style for active actions.
    - Do not replace semantic action tokens with ad-hoc values.

accessibility:
  role: button
  focus:
    tokens:
      inner: Semantic.Color.Focus-Outline.Inner
      outer: Semantic.Color.Focus-Outline.Outer
  hit_area:
    desktop_token: A11y.A11y.modeDesktop.Dimension.Min-Hit-Area
    mobile_token: A11y.A11y.modeMobile.Dimension.Min-Hit-Area
  labeling:
    rules:
      - If View txt is false, provide aria-label or aria-labelledby.
      - Keep visible labels unique and meaningful in context.

token_mapping:
  container.background:
    type=Primary,state=Default: Color/Background/Action/Primary/Default
    type=Primary,state=Hover: Color/Background/Action/Primary/Hover
    type=Primary,state=Active: Color/Background/Action/Primary/Active
    type=Secondary,state=Default: Color/Background/Action/Secondary/Default
    type=Secondary,state=Hover: Color/Background/Action/Secondary/Hover
    type=Secondary,state=Active: Color/Background/Action/Secondary/Active
    type=Cancel,state=Default: Color/Background/Action/Danger/Default
    type=Cancel,state=Hover: Color/Background/Action/Danger/Hover
    type=Cancel,state=Active: Color/Background/Action/Danger/Active
    state=Disabled: Color/Background/Action/Disabled/Default
  container.border:
    default: Color/Border/Neutral/Alpha-10
  container.radius:
    default: Dimension/Border/Radius/200
  container.padding:
    default: Dimension/Spacing/500
  label.color:
    type=Primary,state!=Disabled: Color/Text/Action/On-Primary
    type=Secondary,state!=Disabled: Color/Text/Action/On-Secondary
    type=Cancel,state!=Disabled: Color/Text/Action/On-Danger
    state=Disabled: Color/Text/Action/On-Disabled
  label.typography.family:
    default: Font/Family/Body
  label.typography.size:
    default: Font/Size/300
  label.typography.weight:
    default: Font/Weight/Regular
  label.typography.line_height:
    default: Font/Line-Height/300
  container.min_width:
    default: TBD
  icon.color:
    default: TBD

qa:
  - Properties match the Figma component set.
  - Token mappings reference real token paths where defined.
  - Gaps are captured via explicit TBD entries in token_mapping.

related_components:
  - bottom_bar
  - alert
