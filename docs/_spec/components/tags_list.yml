    required: false
    description: Toggles visibility of item 10.

content_guidelines:
  rules:
    - Keep total visible tags within layout width constraints of the target container.
    - Prefer consistent label taxonomy and ordering for scanability.

best_practices:
  do:
    - Use visibility toggles to match available metadata without creating empty gaps.
    - Keep all tags in one logical group with consistent size.
  dont:
    - Mix unrelated taxonomies in a single list.
    - Use this component when wrapping behavior beyond one line is required and undefined.

