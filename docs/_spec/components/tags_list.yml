name: TagsList
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Tag
  component_set: Tags-List
  component_set_node_id: 2075:295

summary:
  purpose: Displays a horizontal sequence of Tag items with configurable visibility toggles.
  when_to_use: Use to present multiple categorical labels in a compact grouped layout.
  when_not_to_use: Do not use for long textual lists or when independent item interactions are required.

anatomy:
  - id: container
    description: Horizontal auto-layout wrapper for the tag sequence.
  - id: tag_item
    description: Repeated Tag instances controlled by visibility properties (`Show Tag_1` to `Show Tag_10`).

properties:
  - name: Size
    type: enum
    values: [Small, Medium]
    default: Small
    required: true
    description: Controls size variant propagated to child Tag instances and list spacing.
  - name: Show Tag_1
    type: boolean
    default: true
    required: false
    description: Toggles visibility of item 1.
  - name: Show Tag_2
    type: boolean
    default: true
    required: false
    description: Toggles visibility of item 2.
  - name: Show Tag_3
    type: boolean
    default: true
    required: false
    description: Toggles visibility of item 3.
  - name: Show Tag_4
