name: Tag
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Tag
  component_set: Tag
  component_set_node_id: 2018:271

summary:
  purpose: Displays a short categorical label inside a bordered pill-like container.
  when_to_use: Use to communicate compact metadata or category labels with consistent sizing.
  when_not_to_use: Do not use as a primary interactive control or for long free-form content.

anatomy:
  - id: container
    description: Rounded container with fill, stroke, and horizontal/vertical paddings.
  - id: label_text
    description: Single-line text label (`Tag-Text`) centered within the container.

properties:
  - name: Size
    type: enum
    values: [Small, Medium]
    default: Small
    required: true
    description: Controls container dimensions and text sizing.
  - name: Tag-Text
    type: text
    default: "Tag text"
    required: false
    description: Overrides the visible label string.

content_guidelines:
  rules:
    - Keep labels concise and scannable (prefer 1 to 3 words).
    - Use sentence case unless domain conventions require otherwise.

best_practices:
  do:
    - Keep labeling consistent across views using the same tag taxonomy.
    - Use the correct size variant for density requirements.
  dont:
    - Use long labels that force truncation or overflow.
    - Rely on Tag as a substitute for actionable buttons.

accessibility:
  role: TBD
  focus:
    tokens:
      inner: "Semantic.Color.Focus-Outline.Inner"
      outer: "Semantic.Color.Focus-Outline.Outer"
  hit_area:
    desktop_token: "A11y.A11y.Dimension.Min-Hit-Area"
    mobile_token: "Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA"
  labeling:
    rules:
      - If interactive wrappers are used, provide an accessible name matching visible text.
      - For decorative usage, avoid redundant screen reader announcements.

