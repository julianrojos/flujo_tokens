name: PercentagePieGraph
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Pie Graph
  component_set: Percentage-Pie-Graph
  component_set_node_id: 2479:2696

summary:
  purpose: Visualizes percentage progress in a circular graph with central numeric and label text.
  when_to_use: Use to communicate compact percentage progress in dashboards or summary cards.
  when_not_to_use: Do not use for exact comparative analytics across many categories.

anatomy:
  - id: background_ring
    description: Full circular background ring.
  - id: base_ring
    description: Base circular track below progress.
  - id: progress_ring
    description: Progress arc indicating completion percentage.
  - id: content
    description: Center content frame for number and label.
  - id: value_text
    description: Percentage value text (`Change_Graph_Number`).
  - id: label_text
    description: Supporting label text (`Change_Graph_Text`).

properties:
  - name: Change_Graph_Number
    type: text
    default: 65%
    required: false
    description: Overrides the central percentage value text.
  - name: Change_Graph_Text
    type: text
    default: "Graph text"
    required: false
    description: Overrides the supporting graph label text.

content_guidelines:
  rules:
    - Keep percentage value concise and localized consistently.
    - Keep supporting label short enough to remain legible in center content area.

best_practices:
  do:
    - Use for single-metric progress communication.
    - Keep visual contrast between progress and base rings.
  dont:
    - Overload with long descriptive text in center content.
    - Use as a replacement for detailed trend charts.

accessibility:
  role: img
  focus:
    tokens:
      inner: "Semantic.Color.Focus-Outline.Inner"
      outer: "Semantic.Color.Focus-Outline.Outer"
  hit_area:
    desktop_token: "A11y.A11y.modeDesktop.Dimension.Min-Hit-Area"
    mobile_token: "A11y.A11y.modeMobile.Dimension.Min-Hit-Area"
  labeling:
    rules:
      - Provide an accessible text alternative that includes percentage and metric meaning.
      - Do not rely only on color to communicate progress meaning.

token_mapping:
  background_ring.stroke:
    default: TBD
  base_ring.stroke:
    default: TBD
  progress_ring.stroke:
    default: TBD
  value_text.color:
    default: TBD
  label_text.color:
    default: TBD

qa:
  - "Properties match current Figma component property definitions."
  - "Node anatomy reflects layers found in the component."
  - "Token mappings are TBD pending validated token bindings for graph layers."
