name: Checkbox
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Checkbox
  component_set: Checkbox
  component_set_node_id: 524:494

summary:
  purpose: Captures a binary checked or unchecked selection state.
  when_to_use: Use for independent multi-select options and on/off preferences.
  when_not_to_use: Do not use for mutually exclusive choices.

anatomy:
  - id: variant_container
    description: Per-variant frame with fixed 24x24 dimensions.
  - id: icon_instance
    description: Nested icon instance that represents checked or unchecked visuals.

properties:
  - name: State
    type: enum
    values: [Default, Checked]
    default: Default
    required: true
    description: Visual selection state axis.

content_guidelines:
  rules:
    - This component has no text slot.
    - Pair with a label component when user-facing meaning is required.

best_practices:
  do:
    - Use checkbox controls for independent option toggles.
    - Keep control size consistent within the same form context.
  dont:
    - Do not use checkboxes for single immediate actions.
    - Do not use checkboxes for mutually exclusive groups.

accessibility:
  role: checkbox
  focus:
    tokens:
      inner: Semantic.Color.Focus-Outline.Inner
      outer: Semantic.Color.Focus-Outline.Outer
  hit_area:
    desktop_token: A11y.A11y.Dimension.Min-Hit-Area
    mobile_token: Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA
  labeling:
    rules:
      - Accessible labeling strategy is TBD in this design-only artifact.

token_mapping:
  control.icon_color:
    default: TBD

qa:
  - Properties match the Figma component set.
  - Token mapping is TBD and requires validation against token registry.
