name: BottomBarButton
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Bars
  component_set: Bottom_Bar_Button
  component_set_node_id: 694:170

summary:
  purpose: Represents one action/destination item inside the Bottom Bar navigation.
  when_to_use: Use as the repeated item unit within Bottom_Bar navigation.
  when_not_to_use: Do not use as a standalone primary action button.

anatomy:
  - id: container
    description: Root button container.
  - id: icon
    description: Swappable icon slot.
  - id: label
    description: Text label area.

properties:
  - name: State
    type: enum
    values: [Default, Selected]
    default: Default
    required: true
    description: Visual state of the item.
  - name: Change_Text
    type: text
    default: Text
    required: false
    description: Overrides the item label text.
  - name: Change_Bottom_Bar_Button_Icon
    type: instance_swap
    default: TBD
    required: false
    description: Replaces the icon instance.

content_guidelines:
  rules:
    - Keep labels short and scannable.
    - Use consistent label casing across all items.

best_practices:
  do:
    - Keep exactly one selected destination in the parent bar context.
    - Use recognizable icon and label combinations.
  dont:
    - Use long labels that truncate aggressively.
    - Use this component outside bottom navigation context.

accessibility:
  role: TBD
  focus:
    tokens:
      inner: "Semantic.Color.Focus-Outline.Inner"
      outer: "Semantic.Color.Focus-Outline.Outer"
  hit_area:
    desktop_token: "A11y.A11y.Dimension.Min-Hit-Area"
    mobile_token: "Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA"
  labeling:
    rules:
      - Visible label should provide accessible name.
      - Icon-only usage requires explicit accessible labeling.

token_mapping:
  container.background:
    default: TBD
    selected: TBD
  icon.color:
    default: TBD
    selected: TBD
  label.color:
    default: TBD
    selected: TBD

qa:
  - "Properties match current Figma component set definitions."
  - "Token mapping requires follow-up with validated registry mappings."
