name: RadioButtonList
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Radio Button
  component_set: Radio-Button-List

summary:
  purpose: Groups multiple radio-button-label options in one selectable set.
  when_to_use: Use for mutually exclusive options with clear labels.
  when_not_to_use: Do not use when multiple simultaneous selections are required.

anatomy:
  - id: list_container
    description: Vertical or grouped container of radio options.
  - id: option_item
    description: Repeated Radio-Button-Label instance item.

properties:
  - name: Show_Radio_Button_Label_1
    type: boolean
    default: true
    required: false
    description: Toggles visibility of option 1.
  - name: Show_Radio_Button_Label_2
    type: boolean
    default: true
    required: false
    description: Toggles visibility of option 2.
  - name: Show_Radio_Button_Label_3
    type: boolean
    default: true
    required: false
    description: Toggles visibility of option 3.
  - name: Show_Radio_Button_Label_4
    type: boolean
    default: true
    required: false
    description: Toggles visibility of option 4.
  - name: Show_Radio_Button_Label_5
    type: boolean
    default: true
    required: false
    description: Toggles visibility of option 5.
  - name: Show_Radio_Button_Label_6
    type: boolean
    default: true
    required: false
    description: Toggles visibility of option 6.

content_guidelines:
  rules:
    - Each option label must be distinct and self-explanatory.
    - Keep option ordering stable.

best_practices:
  do:
    - Ensure one default checked option is communicated in implementation.
    - Use consistent tone and grammar across options.
  dont:
    - Do not hide selected options dynamically without state reset behavior.
    - Do not use this pattern for non-exclusive choices.

accessibility:
  role: radiogroup
  focus:
    tokens:
      inner: Semantic.Color.Focus-Outline.Inner
      outer: Semantic.Color.Focus-Outline.Outer
  hit_area:
    desktop_token: A11y.A11y.Dimension.Min-Hit-Area
    mobile_token: Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA
  labeling:
    rules:
      - Group label semantics and announcement behavior are TBD.
      - Keyboard roving focus behavior must be defined in implementation.

token_mapping:
  list_container.gap:
    default: TBD
  option_item.text_color:
    default: TBD

qa:
  - Properties match the Figma component definition.
  - Visibility toggles map to option instances in order.
