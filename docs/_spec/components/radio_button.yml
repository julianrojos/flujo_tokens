name: RadioButton
status: draft
figma:
  file: 3hGC1ju0d5AKzaoI9pKIyu
  page: Radio Button
  component_set: Radio-Button
  component_set_node_id: 2304:1971

summary:
  purpose: Represents one mutually exclusive selection control.
  when_to_use: Use within a radio group where only one option can be selected.
  when_not_to_use: Do not use for independent multi-select options.

anatomy:
  - id: control
    description: Circular radio marker control.
  - id: selected_indicator
    description: Inner indicator visible when checked.

properties:
  - name: State
    type: enum
    values: [Default, Checked]
    default: Default
    required: true
    description: Visual selection state of the radio control.

content_guidelines:
  rules:
    - Radio controls should be paired with an explicit label in composition.

best_practices:
  do:
    - Use one checked option per group.
    - Keep radio sizing consistent within the same form context.
  dont:
    - Do not use standalone radios without clear label association.
    - Do not use radios for binary yes/no single-choice scenarios when a switch is expected.

accessibility:
  role: radio
  focus:
    tokens:
      inner: Semantic.Color.Focus-Outline.Inner
      outer: Semantic.Color.Focus-Outline.Outer
  hit_area:
    desktop_token: A11y.A11y.Dimension.Min-Hit-Area
    mobile_token: Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA
  labeling:
    rules:
      - Radio must have accessible label text from composed wrapper.
      - Group semantics are defined by Radio-Button-List composition.

token_mapping:
  control.border:
    "state=Default": TBD
    "state=Checked": TBD
  selected_indicator.fill:
    "state=Checked": TBD

qa:
  - Properties match the Figma component set.
  - Variant names match the Figma source values.
