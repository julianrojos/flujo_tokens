layout: []                 # Auto-layout tree from Figma Artwork; each entry describes one node
  # - node: container
  #   direction: HORIZONTAL | VERTICAL | NONE
  #   alignment: MIN | CENTER | MAX | SPACE_BETWEEN
  #   counter_alignment: MIN | CENTER | MAX
  #   h_sizing: FIXED | HUG | FILL
