name: TBD                  # PascalCase; must match the Figma component set name exactly
status: draft              # draft | ready  (ready requires all TBDs resolved)

# Optional - uncomment when version tracking is needed:
# version:
#   spec: "0.1.0"          # SemVer for this spec file
#   component: "0.1.0"     # SemVer for the component in Figma

figma:
  file: TBD                # Figma file key (not the full URL)
  page: TBD                # Page name in Figma
  component_set: TBD       # Component set name (not the node ID)
  component_set_node_id: TBD  # "1234:567" format - recommended in draft, required in ready

summary:
  purpose: TBD
  when_to_use: TBD
  when_not_to_use: TBD

anatomy:                   # Visual reading order: top-to-bottom, left-to-right; id must be snake_case
  - id: container
    description: TBD
