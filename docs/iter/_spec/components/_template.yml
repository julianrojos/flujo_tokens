    mobile_token: "Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA"
  labeling:
    rules:
      - TBD

token_mapping:             # Keys: "{anatomy_id}.{css_property}"; values keyed by condition string
  container.background:
    "state=default": TBD   # Replace TBD with a real token path, e.g. "Components.Alert.Background.Default"
