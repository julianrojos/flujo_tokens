name: Notification
status: draft
figma:
  file: ERurQSl12VmCGYlk1ciOH3
  page: Notification
  component_set: Notification
  component_set_node_id: 124:8256

summary:
  purpose: Surface concise feedback messages with optional icon, dismiss action, and secondary action.
  when_to_use: Use for inline informational or alert feedback inside flows and views.
  when_not_to_use: Do not use as persistent navigation, long-form content, or modal replacement.

anatomy:
  - id: container
    description: Root feedback container with border and internal spacing.
    dimensions:
      width: 300
      height: auto
      border_weight: 1
      border_radius: 8
  - id: leading_icon
    description: Optional semantic icon shown when Has Icon is enabled.
    dimensions:
      width: 24
      height: 24
    instance_dependency: "Icon"
  - id: title_text
    description: Optional title line controlled by the Title text property.
    text_style: "Body/Strong"
  - id: body_text
    description: Body message controlled by the Body text property.
    text_style: "Body/Base"
  - id: dismiss_action
    description: Optional dismiss control shown when Dismissible is enabled.
    dimensions:
      width: 24
      height: 24
    instance_dependency: "Icon"
  - id: secondary_action
    description: Optional button/action area shown when Has Button is enabled.
    instance_dependency: "Button"

properties:
  - name: Variant
    type: enum
    values: [Message, Alert]
    default: Message
    required: true
    description: Controls semantic variant and visual treatment.
  - name: Title
    type: text
    default: "Title"
    required: false
    description: Overrides the title copy.
  - name: Body
    type: text
    default: "Body text."
    required: true
    description: Main body message content.
  - name: Dismissible
    type: boolean
    default: true
    required: false
    description: Shows or hides dismiss control.
    associated_layers: [dismiss_action]
  - name: Has Icon
    type: boolean
    default: true
    required: false
    description: Shows or hides the leading icon.
    associated_layers: [leading_icon]
  - name: Has Button
    type: boolean
    default: true
    required: false
    description: Shows or hides the optional action button area.
    associated_layers: [secondary_action]
  - name: Icon
    type: instance_swap
    default: Info
    required: false
    description: Swaps the leading icon instance.

content_guidelines:
  rules:
    - Keep title and body concise and scannable.
    - Use sentence case for title and body.
    - Ensure body text is meaningful without relying only on color or icon.

best_practices:
  do:
    - Keep semantic variant aligned with message intent.
    - Use dismissible mode only when the feedback can be safely ignored.
  dont:
    - Use for multi-paragraph or instructional content blocks.
    - Add custom layout overrides that break spacing and alignment.

accessibility:
  role: alert
  focus:
    tokens:
      inner: "Semantic.Color.Focus-Outline.Inner"
      outer: "Semantic.Color.Focus-Outline.Outer"
  hit_area:
    desktop_token: "A11y.A11y.Dimension.Min-Hit-Area"
    mobile_token: "Primitives.Dimension.A11y.Min-Hit-Area-Mobile-AAA"
  labeling:
    rules:
      - Dismiss and button controls must have clear accessible names.
      - Message content must remain understandable without iconography.

token_mapping:
  container.background:
    "variant=Message": TBD
    "variant=Alert": TBD
  container.border:
    "variant=Message": TBD
    "variant=Alert": TBD
  title_text.color:
    "default": TBD
  body_text.color:
    "default": TBD
  leading_icon.color:
    "variant=Message": TBD
    "variant=Alert": TBD

layout:
  - node: container
    direction: HORIZONTAL
    alignment: MIN
    counter_alignment: MIN
    h_sizing: FIXED
    v_sizing: HUG
    item_spacing: 8
    padding: { top: 12, right: 12, bottom: 12, left: 12 }
    children:
      - node: leading_icon
        h_sizing: FIXED
        v_sizing: FIXED
      - node: content_stack
        direction: VERTICAL
        alignment: MIN
        counter_alignment: MIN
        h_sizing: FILL
        v_sizing: HUG
        item_spacing: 4
        padding: { top: 0, right: 0, bottom: 0, left: 0 }
        children:
          - node: title_text
            h_sizing: FILL
            v_sizing: HUG
          - node: body_text
            h_sizing: FILL
            v_sizing: HUG
          - node: secondary_action
            h_sizing: HUG
            v_sizing: HUG
      - node: dismiss_action
        h_sizing: FIXED
        v_sizing: FIXED

qa:
  - "Properties match Figma component-set controls."
  - "Artwork layer includes a hidden source instance that drives anatomy, properties, and layout/spacing exhibits."
  - "Token mapping uses real token keys."
  - "Layout tree matches Figma auto-layout structure."

related_components: []
